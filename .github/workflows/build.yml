 name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Set up Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: 'stable'
      cache: true

  - name: Install dependencies
    run: flutter pub get
    working-directory: eleven

  - name: Build APK
    run: flutter build apk --release
    working-directory: eleven

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-release
      path: eleven/build/app/outputs/flutter-apk/app-release.apk
