# Marketplace App

Una aplicación de compra y venta moderna y ágil que reimagina la experiencia de Facebook Marketplace con una presentación fresca, directa y elegante. Permite a los usuarios descubrir productos locales organizados por categorías, contactar directamente a vendedores mediante chat y ofertas rápidas, y publicar artículos con fotos, descripción y precio en pocos pasos.

## Decisiones de diseño acordadas
- Enfoque: Marketplace multirubro general (ropa, tecnología, hogar, vehículos y servicios).
- Registro de perfil: Flujo guiado con pantalla dedicada para foto de perfil, nombre, edad y ubicación tras el inicio de sesión.
- Contacto y compra: Modal emergente rápido desde el producto con mensaje predeterminado ('¿Sigue disponible?') y oferta personalizada, que conecta directamente al chat.
- Publicación de productos: Botón 'Vender' para subir fotos, nombre, precio, categoría y ubicación.
- Sistema de mensajería: Bandeja de entrada con historial de conversaciones vinculadas al artículo de interés.
- Estilo visual: Moderno y fresco con fondo claro (#F8FAFC), acentos verde esmeralda (#059669), esquinas suaves (14-16px) y tipografía Plus Jakarta Sans.

